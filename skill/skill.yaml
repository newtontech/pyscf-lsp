schema: scientific-lsp-skill/v1
name: pyscf
software: pyscf
display_name: PySCF
description: PySCF workflow preflight for generated Python job scripts.
package:
  name: pyscf-lsp
  install: pip install pyscf-lsp
entrypoints:
  server: pyscf-lsp
  tool: pyscf-lsp-tool
file_patterns:
  - *.pyscf.py
  - run_pyscf.py
operations:
  - capabilities
  - check
  - context
  - complete
  - hover
  - symbols
  - fix
diagnostic_contract: DiagnosticEnvelope/v1
blocking_policy:
  mode: fail-on-blocking
  description: Use --fail-on-blocking when generated inputs must be launch-ready.
source_provenance:
  -
    kind: official_docs
    label: PySCF user guide
    url: https://pyscf.org/user/
