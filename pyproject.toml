[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyscf-lsp"
version = "0.1.1"
description = "Language Server Protocol and CLI tools for PySCF workflow scripts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "newtontech" }]
keywords = ["lsp", "language-server", "materials-science", "matmaster"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "lsprotocol>=2023.0.0",
    "pytest>=7.0",
    "pygls>=1.2.0,<2",
    "ruff>=0.4.0",
    "mypy>=1.8",
]
lsp = [
    "pygls>=1.2.0,<2",
    "lsprotocol>=2023.0.0",
]

[project.urls]
Homepage = "https://github.com/newtontech/pyscf-lsp"
Issues = "https://github.com/newtontech/pyscf-lsp/issues"

[project.scripts]
pyscf-lsp = "pyscf_lsp.cli:lsp_main"
pyscf-lint = "pyscf_lsp.cli:lint_main"
pyscf-fmt = "pyscf_lsp.cli:fmt_main"
pyscf-test = "pyscf_lsp.cli:test_main"
pyscf-lsp-tool = "pyscf_lsp.tool:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyscf_lsp"]

[tool.hatch.build.targets.wheel.force-include]
"lsp-capabilities.json" = "pyscf_lsp/lsp-capabilities.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["tests/fixtures/invalid/syntax_error.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/invalid/*.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
strict = true
